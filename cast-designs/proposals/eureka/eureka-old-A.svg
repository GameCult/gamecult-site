        <ellipse cx="498" cy="456" rx="32" ry="50" fill="#ff8a2a" stroke="#4a1e05" stroke-width="3.5"/>
        <path d="M466 456 A32 50 0 0 1 530 456 C516 444 480 444 466 456 Z" fill="#b8471c"/>
        <ellipse cx="500" cy="486" rx="20" ry="13" fill="#ffc27a"/>
        <ellipse cx="500" cy="458" rx="12" ry="21" fill="#4a1e05"/>
        <ellipse cx="484" cy="436" rx="10" ry="15" fill="#ffffff"/>
        <circle cx="512" cy="482" r="5" fill="#ffffff"/>
