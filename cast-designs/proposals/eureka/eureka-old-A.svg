      <path d="M194 372 C186 238 280 146 402 144 C522 142 614 228 606 362 L592 404 C580 368 566 346 552 330 L542 392 C524 356 504 334 486 322 L470 384 C456 348 442 330 424 320 L398 392 C384 352 364 330 346 322 L322 380 C306 352 288 336 270 334 L262 398 C252 386 242 376 234 368 L226 470 C204 436 194 404 194 372 Z" fill="#e8642a" stroke="#4a1e05" stroke-width="8" stroke-linejoin="round"/>
      <!-- hair shadow on the far side -->
      <path d="M506 158 C560 180 600 240 606 330 L592 404 C580 368 566 346 552 330 L542 392 C524 356 504 334 486 322 C520 290 530 220 506 158 Z" fill="#b8471c"/>
