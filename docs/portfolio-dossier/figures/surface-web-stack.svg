<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Eve surface web stack</title>
  <desc id="desc">A layered SVG diagram of Eve streaming CultUI semantics to web, desktop, mobile, games, and overlays.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06111f"/>
      <stop offset="0.62" stop-color="#05070b"/>
      <stop offset="1" stop-color="#101b12"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:850;fill:#edf6ff}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:700;fill:#b7c7d9}
      .dark{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:850;fill:#07111c}
      .layer{fill:#0b111a;stroke:#59b7ff;stroke-width:3}
      .flow{stroke:#8edfb0;stroke-width:5;fill:none;stroke-linecap:round;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8edfb0"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" class="label" font-size="42">EVE: THE SURFACE WEB STACK</text>
  <text x="800" y="92" text-anchor="middle" class="small" font-size="20">multi-backend streaming DOM with CultUI semantics, not another dashboard silo</text>
  <g transform="translate(198 155)">
    <rect class="layer" width="1204" height="105" rx="24"/>
    <text x="602" y="45" text-anchor="middle" class="label" font-size="28">CULTMESH STATE</text>
    <text x="602" y="76" text-anchor="middle" class="small" font-size="18">typed records, authority, identity, receipts, project-local truth</text>
  </g>
  <path class="flow" d="M800 260 L800 318"/>
  <g transform="translate(270 318)">
    <rect class="layer" width="1060" height="118" rx="24" filter="url(#glow)"/>
    <text x="530" y="50" text-anchor="middle" class="label" font-size="32">CULTUI SEMANTIC DOM</text>
    <text x="530" y="83" text-anchor="middle" class="small" font-size="19">buttons know commands, cards know provenance, panels know project authority</text>
  </g>
  <path class="flow" d="M800 436 L800 500"/>
  <g transform="translate(332 500)">
    <rect x="0" y="0" width="936" height="100" rx="24" fill="#ff8a2a" stroke="#edf6ff" stroke-width="3"/>
    <text x="468" y="42" text-anchor="middle" class="dark" font-size="31">EVE STREAMING TRANSPORT</text>
    <text x="468" y="72" text-anchor="middle" class="dark" font-size="18">incremental UI surfaces, command intents, replayable state</text>
  </g>
  <g transform="translate(92 682)">
    <rect class="layer" width="245" height="118" rx="22"/>
    <text x="122" y="48" text-anchor="middle" class="label" font-size="24">WEB</text>
    <text x="122" y="77" text-anchor="middle" class="small" font-size="16">browser dashboards</text>
  </g>
  <g transform="translate(374 682)">
    <rect class="layer" width="245" height="118" rx="22"/>
    <text x="122" y="48" text-anchor="middle" class="label" font-size="24">DESKTOP</text>
    <text x="122" y="77" text-anchor="middle" class="small" font-size="16">local tools</text>
  </g>
  <g transform="translate(656 682)">
    <rect class="layer" width="245" height="118" rx="22"/>
    <text x="122" y="48" text-anchor="middle" class="label" font-size="24">MOBILE</text>
    <text x="122" y="77" text-anchor="middle" class="small" font-size="16">patron voting</text>
  </g>
  <g transform="translate(938 682)">
    <rect class="layer" width="245" height="118" rx="22"/>
    <text x="122" y="48" text-anchor="middle" class="label" font-size="24">GAME UI</text>
    <text x="122" y="77" text-anchor="middle" class="small" font-size="16">Unity/Fensalir</text>
  </g>
  <g transform="translate(1220 682)">
    <rect class="layer" width="245" height="118" rx="22"/>
    <text x="122" y="48" text-anchor="middle" class="label" font-size="24">OVERLAYS</text>
    <text x="122" y="77" text-anchor="middle" class="small" font-size="16">creator rooms</text>
  </g>
  <path class="flow" d="M800 600 C800 641 214 636 214 682"/>
  <path class="flow" d="M800 600 C800 641 496 636 496 682"/>
  <path class="flow" d="M800 600 L778 682"/>
  <path class="flow" d="M800 600 C800 641 1060 636 1060 682"/>
  <path class="flow" d="M800 600 C800 641 1342 636 1342 682"/>
</svg>
