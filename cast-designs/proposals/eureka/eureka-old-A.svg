      <ellipse cx="508" cy="508" rx="22" ry="11" fill="#ff8a2a" opacity="0.28"/>
      <path d="M286 512 l8 -8 M300 514 l8 -8 M314 514 l8 -8" stroke="#e8642a" stroke-width="2.5" stroke-linecap="round"/>

