      <g id="drawer">
        <rect x="222" y="37" width="101" height="46" rx="2" fill="#2fbf71" stroke-width="2"/>
        <path d="M224 79 L321 79" stroke="#1f8f52" stroke-width="5"/>
        <rect x="252" y="44" width="42" height="15" fill="#c8903a" stroke-width="2"/>
        <rect x="257" y="47" width="32" height="9" fill="#f6e7c8" stroke="none"/>
        <path d="M258 64 C258 78 288 78 288 64 Z" fill="#c8903a" stroke-width="2"/>
      </g>
      <use href="#drawer" x="115"/>
      <use href="#drawer" y="60"/>
      <use href="#drawer" x="115" y="60"/>
      <use href="#drawer" y="120"/>
      <use href="#drawer" y="180"/>
      <use href="#drawer" x="115" y="180"/>
