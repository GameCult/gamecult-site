      <path d="M362 424 L430 424 L430 458 C418 448 378 448 362 458 Z" fill="#0f3d27" opacity="0.85"/>
      <path d="M375 492 C384 508 404 508 413 492 C405 499 383 499 375 492 Z" fill="#9be8bd"/>
      <ellipse cx="395" cy="472" rx="10" ry="20" fill="#0f3d27"/>
    </g>
    <ellipse cx="384" cy="455" rx="8" ry="12" fill="#fff"/>
    <circle cx="405" cy="491" r="4" fill="#fff"/>
    <path d="M358 440 C376 418 412 416 432 436" fill="none" stroke="#0f3d27" stroke-width="6.5"/>
    <path d="M430 434 L441 428 L433 440 Z" fill="#0f3d27" stroke="#0f3d27" stroke-width="2"/>
    <path d="M370 502 C386 510 410 510 423 500" fill="none" stroke="#0f3d27" stroke-width="2.5"/>

    <!-- nose and mouth: knowing half-smile -->
    <path d="M352 482 L357 492 L350 494" fill="none" stroke="#c27d62" stroke-width="2.5"/>
    <path d="M326 527 C338 533 352 532 366 520" fill="none" stroke="#0f3d27" stroke-width="3"/>
    <path d="M366 520 l5 -3" stroke="#0f3d27" stroke-width="2.5"/>

    <!-- glasses: small square brass frames -->
    <g fill="none">
      <path d="M200 440 L150 432" stroke="#0f3d27" stroke-width="6"/>
      <path d="M200 440 L150 432" stroke="#c8903a" stroke-width="2.5"/>
      <rect x="200" y="416" width="116" height="96" rx="9" stroke="#0f3d27" stroke-width="7"/>
      <rect x="200" y="416" width="116" height="96" rx="9" stroke="#c8903a" stroke-width="3"/>
      <path d="M352 418 L434 416 L434 510 L355 512 Z" stroke="#0f3d27" stroke-width="7"/>
      <path d="M352 418 L434 416 L434 510 L355 512 Z" stroke="#c8903a" stroke-width="3"/>
      <path d="M316 448 C328 438 342 438 352 448" stroke="#0f3d27" stroke-width="6"/>
      <path d="M316 448 C328 438 342 438 352 448" stroke="#c8903a" stroke-width="2.5"/>
      <path d="M212 498 L246 426 M226 504 L252 448" stroke="#ffffff" stroke-width="5" opacity="0.5"/>
      <path d="M364 498 L392 426" stroke="#ffffff" stroke-width="5" opacity="0.5"/>
    </g>

    </g>
    <!-- near sidelock (in front of face) -->
    <path d="M136 310 C130 420 132 540 126 642 L202 642 C199 560 192 470 196 390 L178 312 Z" fill="#2a2340" stroke="#0f3d27" stroke-width="3"/>
    <path d="M178 330 C186 420 190 520 188 640 L202 642 C199 560 192 470 196 390 Z" fill="#1a1530"/>
    <!-- fringe: blunt, straight -->
    <path d="M126 340 C124 240 214 188 318 188 C424 188 494 240 490 340 L470 396 L150 404 Z" fill="#2a2340" stroke="#0f3d27" stroke-width="3"/>
    <path d="M150 404 L470 396 L470 382 L150 390 Z" fill="#1a1530"/>
    <path d="M236 360 L236 402 M300 356 L300 400 M372 356 L372 398 M430 358 L430 396" stroke="#1a1530" stroke-width="3"/>
