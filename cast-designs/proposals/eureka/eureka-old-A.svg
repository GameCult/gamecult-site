      <path d="M404 128 L424 80 L410 84 L446 18 L440 50 L456 46 L430 104" fill="none" stroke="#59b7ff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="M404 128 L424 80 L410 84 L446 18 L440 50 L456 46 L430 104" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      <g stroke="#59b7ff" stroke-width="5" stroke-linecap="round">
