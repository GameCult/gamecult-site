    <path d="M226 392 C246 384 276 384 296 390" fill="none" stroke="#2a2340" stroke-width="6"/>
    <path d="M366 380 C380 366 408 364 426 374" fill="none" stroke="#2a2340" stroke-width="6"/>

    <!-- ===== hat: stack of card-catalogue drawers ===== -->
    <g transform="translate(0 42) rotate(-4 330 270)" stroke="#0f3d27" stroke-width="3">
