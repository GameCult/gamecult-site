<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="1200" height="800">
  <title>Nibu, direction B: Smeared Hostess</title>
  <defs>
    <!-- palette: key #9a6bff, line #2a1452, cyan #7af0ff, white #f2f0ff, hull #1a1726, skin #e9c9d6
         cel shadows: violet #6a47c9, skin #cf9fb8, white #c9c3ea; hair highlight #c7b2ff -->
    <filter id="holo" x="-20%" y="-20%" width="140%" height="140%">
      <feColorMatrix in="SourceGraphic" type="matrix" values="0.20 0.30 0.10 0 0.22  0.12 0.32 0.16 0 0.10  0.08 0.20 0.30 0 0.48  0 0 0 0.62 0" result="tint"/>
      <feMorphology in="SourceAlpha" operator="dilate" radius="3" result="fat"/>
      <feComposite in="fat" in2="SourceAlpha" operator="out" result="ring"/>
      <feFlood flood-color="#7af0ff"/>
      <feComposite in2="ring" operator="in" result="edge"/>
      <feMerge><feMergeNode in="tint"/><feMergeNode in="edge"/></feMerge>
    </filter>
    <filter id="black" x="-10%" y="-10%" width="120%" height="120%">
      <feFlood flood-color="#000"/>
      <feComposite in2="SourceAlpha" operator="in"/>
    </filter>
    <pattern id="scan" width="10" height="7" patternUnits="userSpaceOnUse">
      <rect width="10" height="4.5" fill="#fff"/>
    </pattern>
    <mask id="scanMask" maskUnits="userSpaceOnUse" x="-600" y="-600" width="2400" height="2400">
      <rect x="-600" y="-600" width="2400" height="2400" fill="url(#scan)"/>
    </mask>
    <clipPath id="glitchBand"><rect x="-400" y="300" width="1400" height="46"/></clipPath>
    <clipPath id="glitchBand2"><rect x="-400" y="520" width="1400" height="22"/></clipPath>

    <!-- ===== BUST, local space 640 x 760 ===== -->
    <path id="faceP" d="M198,285 C192,365 214,440 300,494 C326,510 354,512 374,498 C424,466 454,408 462,298 Z"/>
    <clipPath id="faceClip"><use xlink:href="#faceP"/></clipPath>
    <path id="crownP" d="M134,330 C118,168 214,60 336,60 C466,60 552,160 538,322 C530,318 515,305 506,296
      L500,334 Q480,300 455,280 Q450,312 446,348 Q425,300 392,274 Q388,320 384,356 Q360,300 322,274
      Q318,320 312,356 Q290,300 255,276 Q250,312 244,346 Q225,305 200,288 C180,300 158,318 134,330 Z"/>

    <g id="hairBack">
      <path d="M336,58 C470,58 556,160 546,300 C540,390 524,452 508,514 L470,500 L230,470 L200,505 L160,524 C136,450 122,370 126,300 C128,160 210,58 336,58 Z" fill="#6a47c9" stroke="#2a1452" stroke-width="8" stroke-linejoin="round"/>
      <!-- far lock, behind the face -->
      <path d="M540,290 C546,392 512,474 450,534 C470,470 470,380 460,300 Z" fill="#9a6bff" stroke="#2a1452" stroke-width="7" stroke-linejoin="round"/>
      <path d="M528,330 C530,400 510,460 470,508" fill="none" stroke="#7af0ff" stroke-width="4" stroke-linecap="round"/>
    </g>

    <g id="bodyB">
      <path d="M300,466 L298,566 L394,566 L392,466 Z" fill="#e9c9d6" stroke="#2a1452" stroke-width="5"/>
      <path d="M298,488 C330,526 370,520 394,486 L394,548 L298,548 Z" fill="#cf9fb8"/>
      <path d="M116,770 C122,652 190,594 292,568 L400,564 C498,586 558,652 568,770 Z" fill="#f2f0ff" stroke="#2a1452" stroke-width="8" stroke-linejoin="round"/>
      <path d="M420,574 C502,602 550,662 560,770 L482,770 C478,694 458,632 412,592 Z" fill="#c9c3ea"/>
      <path d="M526,624 C552,664 562,714 565,770" fill="none" stroke="#9a6bff" stroke-width="6" stroke-linecap="round"/>
      <path d="M292,570 C302,644 312,704 318,770 M402,566 C390,644 376,704 372,770" fill="none" stroke="#9a6bff" stroke-width="7"/>
      <!-- near-shoulder wedge epaulette -->
      <path d="M128,712 C148,646 192,608 246,590 L258,612 C208,630 172,666 160,716 Z" fill="#9a6bff" stroke="#2a1452" stroke-width="4" stroke-linejoin="round"/>
      <!-- high collar -->
      <path d="M284,530 L288,592 C322,610 372,610 406,592 L404,528 C372,544 318,546 284,530 Z" fill="#f2f0ff" stroke="#2a1452" stroke-width="5" stroke-linejoin="round"/>
      <path d="M380,540 L404,530 L406,592 L384,600 Z" fill="#c9c3ea"/>
      <path d="M286,532 C318,548 372,546 404,530" fill="none" stroke="#9a6bff" stroke-width="6"/>
      <!-- ascot, swept wedge tails -->
      <path d="M332,610 L292,700 L322,684 L336,716 L352,612 Z M356,610 L404,684 L376,680 L362,614 Z" fill="#9a6bff" stroke="#2a1452" stroke-width="4" stroke-linejoin="round"/>
      <path d="M320,590 L370,590 L364,616 L326,616 Z" fill="#6a47c9" stroke="#2a1452" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <g id="headFront">
      <use xlink:href="#faceP" fill="#e9c9d6" stroke="#2a1452" stroke-width="6"/>
      <g clip-path="url(#faceClip)">
        <use xlink:href="#crownP" transform="translate(6,16)" fill="#cf9fb8"/>
        <path d="M440,330 C452,400 430,460 380,500 L480,520 L500,300 Z" fill="#cf9fb8"/>
      </g>
      <path d="M452,360 C448,420 424,466 384,494" fill="none" stroke="#9a6bff" stroke-width="5" stroke-linecap="round"/>
      <!-- near lock, in front of the cheek -->
      <path d="M130,300 C126,404 160,484 256,536 C218,472 210,392 216,312 Z" fill="#9a6bff" stroke="#2a1452" stroke-width="7" stroke-linejoin="round"/>
      <path d="M214,322 C210,396 216,470 252,532 C226,500 196,470 190,430 C186,390 192,350 200,322 Z" fill="#6a47c9"/>
      <use xlink:href="#crownP" fill="#9a6bff" stroke="#2a1452" stroke-width="8" stroke-linejoin="round"/>
      <!-- one hair highlight band -->
      <path d="M176,206 C196,156 246,126 300,116 L292,142 L322,114 L326,136 L356,112 L360,130 L392,114 C330,124 236,150 176,206 Z" fill="#c7b2ff"/>
      <path d="M190,300 C176,250 190,200 220,166" fill="none" stroke="#6a47c9" stroke-width="4" stroke-linecap="round"/>
      <path d="M500,250 C506,214 500,180 482,150" fill="none" stroke="#7af0ff" stroke-width="5" stroke-linecap="round"/>
      <!-- hostess pillbox cap, tilted -->
      <g transform="rotate(-14 405 90)">
        <path d="M338,112 L350,42 L460,42 L472,108 C440,124 368,126 338,112 Z" fill="#f2f0ff" stroke="#2a1452" stroke-width="6" stroke-linejoin="round"/>
        <path d="M438,44 L460,42 L470,96 L448,102 Z" fill="#c9c3ea"/>
        <ellipse cx="405" cy="42" rx="55" ry="12" fill="#f2f0ff" stroke="#2a1452" stroke-width="5"/>
        <path d="M342,90 C380,104 430,104 468,88 L472,108 C440,124 368,126 338,112 Z" fill="#9a6bff" stroke="#2a1452" stroke-width="4" stroke-linejoin="round"/>
        <path d="M374,74 L405,56 L436,74 L405,66 Z" fill="#7af0ff" stroke="#2a1452" stroke-width="3" stroke-linejoin="round"/>
      </g>
    </g>

    <!-- iris construction, shared by both expressions -->
    <clipPath id="wN"><path d="M228,372 C238,350 300,346 320,370 C324,402 312,432 274,436 C240,432 224,404 228,372 Z"/></clipPath>
    <clipPath id="wF"><path d="M372,370 C380,350 426,348 440,368 C444,400 434,430 406,434 C382,430 368,404 372,370 Z"/></clipPath>
    <clipPath id="iN"><ellipse cx="278" cy="398" rx="33" ry="42"/></clipPath>
    <clipPath id="iF"><ellipse cx="408" cy="396" rx="25" ry="40"/></clipPath>

    <g id="exprPolite">
      <path d="M238,334 Q272,320 308,330" fill="none" stroke="#2a1452" stroke-width="6" stroke-linecap="round"/>
      <path d="M378,328 Q406,318 434,326" fill="none" stroke="#2a1452" stroke-width="5" stroke-linecap="round"/>
      <!-- near eye -->
      <path d="M228,372 C238,350 300,346 320,370 C324,402 312,432 274,436 C240,432 224,404 228,372 Z" fill="#f7f5ff"/>
      <g clip-path="url(#wN)"><g clip-path="url(#iN)">
        <rect x="200" y="340" width="140" height="120" fill="#9a6bff"/>
        <ellipse cx="278" cy="372" rx="40" ry="26" fill="#4b2a99"/>
        <ellipse cx="282" cy="434" rx="26" ry="13" fill="#7af0ff"/>
        <ellipse cx="280" cy="402" rx="13" ry="19" fill="#2a1452"/>
      </g>
        <ellipse cx="278" cy="398" rx="33" ry="42" fill="none" stroke="#2a1452" stroke-width="3"/>
        <ellipse cx="263" cy="382" rx="10" ry="12" fill="#fff"/>
        <circle cx="295" cy="420" r="5" fill="#fff"/>
      </g>
      <path d="M220,384 C230,346 302,336 328,362 L350,348 L336,376 C314,358 250,358 228,390 Z" fill="#2a1452"/>
      <path d="M248,436 Q274,444 300,432" fill="none" stroke="#2a1452" stroke-width="3.5" stroke-linecap="round"/>
      <!-- far eye -->
      <path d="M372,370 C380,350 426,348 440,368 C444,400 434,430 406,434 C382,430 368,404 372,370 Z" fill="#f7f5ff"/>
      <g clip-path="url(#wF)"><g clip-path="url(#iF)">
        <rect x="360" y="340" width="100" height="120" fill="#9a6bff"/>
        <ellipse cx="408" cy="370" rx="30" ry="25" fill="#4b2a99"/>
        <ellipse cx="410" cy="432" rx="20" ry="12" fill="#7af0ff"/>
        <ellipse cx="410" cy="400" rx="10" ry="18" fill="#2a1452"/>
      </g>
        <ellipse cx="408" cy="396" rx="25" ry="40" fill="none" stroke="#2a1452" stroke-width="3"/>
        <ellipse cx="397" cy="381" rx="8" ry="10" fill="#fff"/>
        <circle cx="419" cy="418" r="4" fill="#fff"/>
      </g>
      <path d="M366,384 C376,346 430,336 448,358 L466,348 L452,376 C434,358 386,358 372,392 Z" fill="#2a1452"/>
      <path d="M386,432 Q408,440 428,430" fill="none" stroke="#2a1452" stroke-width="3" stroke-linecap="round"/>
      <path d="M354,440 Q363,448 355,453" fill="none" stroke="#2a1452" stroke-width="3" stroke-linecap="round"/>
      <!-- polite, dangerous: closed smile with one corner hooked up -->
      <path d="M326,472 Q350,484 378,468 L386,460" fill="none" stroke="#2a1452" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M238,452 l-9,11 M252,452 l-9,11 M424,446 l-7,9" stroke="#d98aa8" stroke-width="3" stroke-linecap="round"/>
    </g>

    <g id="exprAngry">
      <path d="M226,316 L314,346" stroke="#2a1452" stroke-width="10" stroke-linecap="round"/>
      <path d="M372,346 L444,318" stroke="#2a1452" stroke-width="9" stroke-linecap="round"/>
      <path d="M232,386 C252,372 300,370 318,384 C318,406 304,424 274,426 C246,424 232,406 232,386 Z" fill="#fff"/>
      <ellipse cx="282" cy="400" rx="20" ry="24" fill="#9a6bff"/>
      <ellipse cx="283" cy="402" rx="5" ry="12" fill="#2a1452"/>
      <path d="M222,384 L328,374 L332,392 L228,396 Z" fill="#2a1452"/>
      <path d="M376,384 C392,372 428,370 438,382 C438,404 428,422 406,424 C386,422 376,406 376,384 Z" fill="#fff"/>
      <ellipse cx="408" cy="400" rx="16" ry="22" fill="#9a6bff"/>
      <ellipse cx="409" cy="402" rx="4" ry="11" fill="#2a1452"/>
      <path d="M368,372 L448,382 L446,396 L372,392 Z" fill="#2a1452"/>
      <path d="M314,458 L392,452 C384,494 334,500 314,458 Z" fill="#2a1452"/>
      <path d="M318,460 L388,455 L386,466 L376,476 L370,466 L324,470 Z" fill="#fff"/>
    </g>

    <g id="handCard">
      <g transform="rotate(14 584 440)">
        <rect x="546" y="370" width="80" height="112" rx="9" fill="#1a1726" stroke="#2a1452" stroke-width="6"/>
        <rect x="549" y="392" width="74" height="14" fill="#7af0ff"/>
        <rect x="558" y="420" width="24" height="18" rx="3" fill="#9a6bff" stroke="#7af0ff" stroke-width="2"/>
        <path d="M594,452 L612,452 M594,462 L606,462" stroke="#9a6bff" stroke-width="4" stroke-linecap="round"/>
      </g>
      <path d="M548,770 C552,690 556,630 548,570 L608,562 C616,626 614,694 606,770 Z" fill="#f2f0ff" stroke="#2a1452" stroke-width="7" stroke-linejoin="round"/>
      <path d="M582,580 L608,576 C614,640 612,700 606,770 L586,770 C590,700 590,640 582,580 Z" fill="#c9c3ea"/>
      <path d="M544,560 C532,520 552,490 580,492 C608,494 616,524 610,554 C600,576 556,580 544,560 Z" fill="#e9c9d6" stroke="#2a1452" stroke-width="6" stroke-linejoin="round"/>
      <path d="M560,500 Q565,522 560,544 M576,496 Q582,520 577,544 M592,500 Q598,520 594,540" fill="none" stroke="#2a1452" stroke-width="3" stroke-linecap="round"/>
      <path d="M544,568 L612,558 L614,582 L548,592 Z" fill="#9a6bff" stroke="#2a1452" stroke-width="4" stroke-linejoin="round"/>
    </g>

    <g id="ghostCore" transform="translate(-178,-16) rotate(-3 336 400)">
      <use xlink:href="#hairBack"/><use xlink:href="#bodyB"/><use xlink:href="#headFront"/><use xlink:href="#exprAngry"/>
    </g>

    <g id="bust">
      <g filter="url(#holo)" mask="url(#scanMask)"><use xlink:href="#ghostCore"/></g>
      <g filter="url(#holo)" mask="url(#scanMask)" clip-path="url(#glitchBand)"><use xlink:href="#ghostCore" transform="translate(22,0)"/></g>
      <use xlink:href="#hairBack"/>
      <use xlink:href="#bodyB"/>
      <use xlink:href="#headFront"/>
      <use xlink:href="#exprPolite"/>
      <use xlink:href="#handCard"/>
      <!-- the seam: her own outline slips for one band -->
      <g clip-path="url(#glitchBand2)" opacity="0.85"><use xlink:href="#bodyB" transform="translate(-14,0)" filter="url(#holo)"/></g>
    </g>
    <g id="bustSil">
      <use xlink:href="#ghostCore"/>
      <use xlink:href="#hairBack"/><use xlink:href="#bodyB"/><use xlink:href="#headFront"/><use xlink:href="#handCard"/>
    </g>

    <!-- ===== FULL BODY, drawn on its own (2.3 heads), origin at feet centre ===== -->
    <g id="fbCore">
      <path d="M-84,210 C-92,128 -40,82 6,82 C60,82 102,124 92,210 L84,250 L-74,256 Z" fill="#6a47c9" stroke="#2a1452" stroke-width="5" stroke-linejoin="round"/>
      <path d="M96,180 C98,226 82,256 52,272 C64,240 66,210 64,180 Z" fill="#9a6bff" stroke="#2a1452" stroke-width="4" stroke-linejoin="round"/>
      <!-- legs, boots -->
      <path d="M-26,384 L-24,428 M18,384 L20,428" stroke="#2a1452" stroke-width="20" stroke-linecap="round"/>
      <path d="M-26,384 L-24,428 M18,384 L20,428" stroke="#e9c9d6" stroke-width="12" stroke-linecap="round"/>
      <path d="M-40,424 L-12,422 L-10,452 L-46,454 C-50,440 -46,430 -40,424 Z M8,422 L34,424 C42,432 44,442 40,454 L6,452 Z" fill="#9a6bff" stroke="#2a1452" stroke-width="4" stroke-linejoin="round"/>
      <!-- far arm raised with the keycard -->
      <path d="M30,272 L66,246 L70,214" fill="none" stroke="#2a1452" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M30,272 L66,246 L70,214" fill="none" stroke="#f2f0ff" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
      <g transform="rotate(14 76 186)"><rect x="62" y="164" width="28" height="38" rx="4" fill="#1a1726" stroke="#2a1452" stroke-width="3"/><rect x="63" y="172" width="26" height="6" fill="#7af0ff"/></g>
      <circle cx="70" cy="210" r="10" fill="#e9c9d6" stroke="#2a1452" stroke-width="3.5"/>
      <!-- dress -->
      <path d="M-34,262 L34,262 L46,330 L66,390 L-66,390 L-46,330 Z" fill="#f2f0ff" stroke="#2a1452" stroke-width="5" stroke-linejoin="round"/>
      <path d="M14,262 L34,262 L46,330 L66,390 L30,390 Z" fill="#c9c3ea"/>
      <path d="M-62,378 L62,378" stroke="#9a6bff" stroke-width="8"/>
      <path d="M-46,330 L46,330" stroke="#9a6bff" stroke-width="5"/>
      <path d="M-66,390 L66,390" stroke="#2a1452" stroke-width="5" stroke-linecap="round"/>
      <!-- near arm -->
      <path d="M-30,272 L-50,322" fill="none" stroke="#2a1452" stroke-width="20" stroke-linecap="round"/>
      <path d="M-30,272 L-50,322" fill="none" stroke="#f2f0ff" stroke-width="12" stroke-linecap="round"/>
      <circle cx="-52" cy="328" r="10" fill="#e9c9d6" stroke="#2a1452" stroke-width="3.5"/>
      <path d="M-8,262 L-24,300 L-10,294 L-4,312 L6,264 Z M10,264 L30,296 L18,294 Z" fill="#9a6bff" stroke="#2a1452" stroke-width="3" stroke-linejoin="round"/>
      <!-- head -->
      <path d="M-62,160 C-64,214 -24,248 8,252 C44,250 74,214 74,160 Z" fill="#e9c9d6" stroke="#2a1452" stroke-width="4"/>
      <path d="M-86,186 C-88,232 -66,258 -30,272 C-48,240 -54,212 -54,182 Z" fill="#9a6bff" stroke="#2a1452" stroke-width="4" stroke-linejoin="round"/>
      <path d="M-86,186 C-98,112 -40,80 8,80 C64,80 104,116 96,186 L88,180 L84,200 Q76,180 68,170 L60,204 Q50,180 38,168 L30,206 Q18,180 6,168 L-4,206 Q-16,180 -28,170 L-36,200 Q-46,182 -58,176 C-68,180 -78,184 -86,186 Z" fill="#9a6bff" stroke="#2a1452" stroke-width="5" stroke-linejoin="round"/>
      <path d="M-58,124 C-44,104 -20,94 6,92 L2,104 L18,92 L20,102 L36,94 C10,98 -30,108 -58,124 Z" fill="#c7b2ff"/>
      <ellipse cx="-24" cy="214" rx="13" ry="17" fill="#9a6bff" stroke="#2a1452" stroke-width="3"/>
      <ellipse cx="-22" cy="217" rx="5" ry="8" fill="#2a1452"/><circle cx="-29" cy="207" r="4" fill="#fff"/>
      <path d="M-40,206 C-34,192 -10,190 -4,202 L4,196 L-2,208" fill="#2a1452" stroke="#2a1452" stroke-width="3" stroke-linejoin="round"/>
      <ellipse cx="36" cy="212" rx="10" ry="16" fill="#9a6bff" stroke="#2a1452" stroke-width="3"/>
      <ellipse cx="37" cy="215" rx="4" ry="7" fill="#2a1452"/><circle cx="32" cy="206" r="3" fill="#fff"/>
      <path d="M24,204 C30,192 48,190 52,200 L60,194 L54,206" fill="#2a1452" stroke="#2a1452" stroke-width="3" stroke-linejoin="round"/>
      <path d="M6,236 Q14,240 22,234 L25,230" fill="none" stroke="#2a1452" stroke-width="2.5" stroke-linecap="round"/>
      <g transform="rotate(-14 30 80)">
        <path d="M0,92 L6,58 L58,58 L64,90 C48,98 16,98 0,92 Z" fill="#f2f0ff" stroke="#2a1452" stroke-width="4" stroke-linejoin="round"/>
        <path d="M2,82 C20,88 44,88 62,80 L64,90 C48,98 16,98 0,92 Z" fill="#9a6bff"/>
        <path d="M20,72 L32,64 L44,72 L32,69 Z" fill="#7af0ff"/>
      </g>
    </g>
  </defs>

  <rect width="1200" height="800" fill="#eceaf2"/>

  <!-- dialogue card -->
  <clipPath id="cardClip"><polygon points="72,18 784,18 744,782 30,782"/></clipPath>
  <polygon points="72,18 784,18 744,782 30,782" fill="#07111a"/>
  <g clip-path="url(#cardClip)">
    <path d="M400,18 L784,18 L770,300 Z" fill="#9a6bff" opacity="0.10"/>
    <use xlink:href="#bust" transform="translate(150,26) scale(0.96)"/>
  </g>
  <polygon points="72,18 784,18 744,782 30,782" fill="none" stroke="#9a6bff" stroke-width="4"/>
  <g font-family="Consolas, 'Courier New', monospace" fill="#f2f0ff">
    <text x="92" y="60" font-size="30" letter-spacing="9" font-weight="700" fill="#9a6bff">NIBU</text>
    <text x="92" y="86" font-size="14" letter-spacing="5">B / SMEARED HOSTESS</text>
  </g>

  <!-- full body -->
  <g font-family="'Segoe UI', Arial, sans-serif" fill="#2a1452">
    <text x="808" y="40" font-size="13" letter-spacing="2" font-weight="700">FULL BODY  /  2.3 HEADS</text>
    <g transform="translate(985,470) scale(0.98) translate(0,-460)">
      <g filter="url(#holo)" mask="url(#scanMask)" transform="translate(-58,-8)"><use xlink:href="#fbCore"/></g>
      <use xlink:href="#fbCore"/>
    </g>
    <line x1="820" y1="474" x2="1170" y2="474" stroke="#c9c3ea" stroke-width="2"/>

    <text x="808" y="508" font-size="13" letter-spacing="2" font-weight="700">SILHOUETTE</text>
    <rect x="800" y="518" width="160" height="160" fill="#fff" stroke="#c9c3ea" stroke-width="2"/>
    <use xlink:href="#bustSil" transform="translate(828,526) scale(0.19)" filter="url(#black)"/>

    <text x="984" y="508" font-size="13" letter-spacing="2" font-weight="700">PALETTE</text>
    <g font-size="11" font-family="Consolas, monospace">
      <rect x="984" y="518" width="56" height="44" fill="#9a6bff"/><text x="1046" y="544">#9a6bff key</text>
      <rect x="984" y="566" width="56" height="20" fill="#2a1452"/><text x="1046" y="580">#2a1452 line</text>
      <rect x="984" y="590" width="56" height="20" fill="#7af0ff"/><text x="1046" y="604">#7af0ff projection</text>
      <rect x="984" y="614" width="56" height="20" fill="#f2f0ff" stroke="#c9c3ea"/><text x="1046" y="628">#f2f0ff uniform</text>
      <rect x="984" y="638" width="56" height="20" fill="#1a1726"/><text x="1046" y="652">#1a1726 hull</text>
      <rect x="984" y="662" width="56" height="16" fill="#e9c9d6"/><text x="1046" y="674">#e9c9d6 skin</text>
    </g>

    <text x="808" y="718" font-size="13" letter-spacing="2" font-weight="700">HOOK</text>
    <text x="808" y="740" font-size="15">A hostess hologram with an out-of-sync twin</text>
    <text x="808" y="760" font-size="15">behind her, already wearing the face she</text>
    <text x="808" y="780" font-size="15">has not made yet.</text>
  </g>
</svg>
