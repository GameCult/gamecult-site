    <path d="M236 330 L236 350 M300 324 L300 344 M372 324 L372 344 M430 330 L430 348" stroke="#2a2340" stroke-width="5"/>
    <path d="M470 330 L470 386" stroke="#2fbf71" stroke-width="4"/>
