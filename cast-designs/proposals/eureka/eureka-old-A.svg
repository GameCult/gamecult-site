        <rect x="-34" y="-34" width="58" height="22" rx="11" fill="#1f3550" stroke="#4a1e05" stroke-width="6"/>
        <rect x="-38" y="-14" width="62" height="22" rx="11" fill="#1f3550" stroke="#4a1e05" stroke-width="6"/>
        <rect x="-38" y="6" width="62" height="22" rx="11" fill="#1f3550" stroke="#4a1e05" stroke-width="6"/>
        <rect x="-34" y="26" width="56" height="22" rx="11" fill="#1f3550" stroke="#4a1e05" stroke-width="6"/>
        <path d="M18 -36 C40 -40 52 -24 46 -8 C42 4 30 6 22 0 Z" fill="#1f3550" stroke="#4a1e05" stroke-width="6" stroke-linejoin="round"/>
        <path d="M-30 -28 C-30 -10 -32 10 -30 36" fill="none" stroke="#59b7ff" stroke-width="3" stroke-linecap="round" opacity="0.85"/>
      </g>
    </g>

    <g id="bustA">
      <use href="#wrench" transform="translate(318,820) rotate(-112)"/>
      <use href="#hairBack"/>
      <use href="#spark"/>
      <use href="#torsoA"/>
      <use href="#headFront"/>
      <use href="#fistA"/>
    </g>
