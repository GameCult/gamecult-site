        <ellipse cx="334" cy="456" rx="40" ry="52" fill="#ff8a2a" stroke="#4a1e05" stroke-width="3.5"/>
        <path d="M294 456 A40 52 0 0 1 374 456 C356 444 312 444 294 456 Z" fill="#b8471c"/>
        <ellipse cx="336" cy="486" rx="26" ry="14" fill="#ffc27a"/>
        <ellipse cx="336" cy="458" rx="15" ry="22" fill="#4a1e05"/>
        <ellipse cx="316" cy="436" rx="13" ry="17" fill="#ffffff"/>
        <circle cx="352" cy="482" r="6" fill="#ffffff"/>
      </g>
      <path d="M260 452 C266 408 336 386 386 410 L402 398 L396 420 L386 426 C340 406 288 416 270 456 Z" fill="#4a1e05"/>
      <path d="M258 452 L248 444 M262 438 L250 426" stroke="#4a1e05" stroke-width="5" stroke-linecap="round"/>
      <path d="M292 498 C312 506 340 506 360 496" fill="none" stroke="#4a1e05" stroke-width="3.5" stroke-linecap="round"/>

      <!-- far eye -->
      <path d="M454 432 C472 410 514 404 534 420 C540 450 534 480 522 494 C500 504 472 502 460 490 C452 470 450 450 454 432 Z" fill="#ffffff"/>
      <g clip-path="url(#eyeR)">
