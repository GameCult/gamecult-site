  <!-- sheet -->
  <rect width="1200" height="800" fill="#f4efe7"/>

  <!-- dialogue card (context only) -->
  <polygon points="74,46 786,46 740,780 20,780" fill="#07111a"/>
  <polygon points="74,46 786,46 740,780 20,780" fill="none" stroke="#ff8a2a" stroke-width="5"/>
  <path d="M86 58 L120 58 L90 520" fill="none" stroke="#59b7ff" stroke-width="2" opacity="0.5"/>

  <g clip-path="url(#cardClip)">
    <use href="#bustA" transform="translate(66,94) scale(0.86)"/>
  </g>

  <!-- nameplate -->
  <polygon points="484,704 744,704 741,752 478,752" fill="#ff8a2a"/>
  <text x="510" y="739" font-family="Consolas, 'Courier New', monospace" font-size="30" font-weight="700" letter-spacing="8" fill="#07111a">EUREKA</text>

  <!-- right column -->
  <text x="812" y="66" font-family="Consolas, 'Courier New', monospace" font-size="22" font-weight="700" letter-spacing="4" fill="#4a1e05">EUREKA / A / THE SPARK</text>
  <text x="812" y="94" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4a1e05">Hook: one huge lightning-spark ahoge springs</text>
  <text x="812" y="113" font-family="'Segoe UI', Arial, sans-serif" font-size="15" fill="#4a1e05">from her crown; a big wrench rides her shoulder.</text>

  <!-- full body chibi, 2.5 heads -->
  <g id="fullA" transform="translate(0,34)">
    <!-- wrench behind -->
    <use href="#wrench" transform="translate(922,432) rotate(-116) scale(0.42)"/>
    <use href="#hairBack" transform="translate(768,118) scale(0.36)"/>
    <use href="#spark" transform="translate(768,118) scale(0.36)"/>
    <!-- back arm (far), hanging -->
    <path d="M944 352 C960 372 966 400 962 428 C958 440 944 440 942 428 C942 404 938 380 930 364 Z" fill="#ffd6a8" stroke="#4a1e05" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="952" cy="432" r="10" fill="#1f3550" stroke="#4a1e05" stroke-width="4"/>
    <!-- legs: navy jumpsuit -->
    <path d="M866 424 L940 424 L946 540 L912 542 L906 470 L900 542 L864 540 Z" fill="#1f3550" stroke="#4a1e05" stroke-width="5" stroke-linejoin="round"/>
    <path d="M920 430 L940 424 L946 540 L926 540 Z" fill="#07111a"/>
    <!-- boots -->
    <path d="M860 534 L902 534 L904 566 L848 566 C848 552 852 540 860 534 Z" fill="#4a1e05"/>
    <path d="M910 534 L948 534 C958 542 962 556 962 566 L908 566 Z" fill="#4a1e05"/>
    <path d="M852 556 L902 556 M912 556 L960 556" stroke="#ff8a2a" stroke-width="3"/>
    <!-- tank torso -->
    <path d="M870 344 C886 334 926 334 940 344 L944 418 L866 418 Z" fill="#ff8a2a" stroke="#4a1e05" stroke-width="5" stroke-linejoin="round"/>
    <path d="M920 342 C932 340 940 344 940 344 L944 418 L924 418 Z" fill="#e8642a"/>
    <!-- jumpsuit top tied at the waist -->
    <path d="M860 412 L948 412 L950 432 L858 432 Z" fill="#1f3550" stroke="#4a1e05" stroke-width="5" stroke-linejoin="round"/>
    <path d="M880 426 C870 450 862 474 858 494 L874 496 C878 474 884 452 894 430 Z" fill="#1f3550" stroke="#4a1e05" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="888" cy="424" r="9" fill="#1f3550" stroke="#4a1e05" stroke-width="4"/>
    <!-- neck -->
    <path d="M892 322 L894 340 L916 340 L918 322 Z" fill="#f2b089" stroke="#4a1e05" stroke-width="3"/>
    <use href="#headFront" transform="translate(768,118) scale(0.36)"/>
    <!-- near arm raised to the wrench on the shoulder -->
    <path d="M870 350 C852 360 846 380 856 392 C866 398 874 386 878 372 Z" fill="#ffd6a8" stroke="#4a1e05" stroke-width="4" stroke-linejoin="round"/>
    <circle cx="858" cy="380" r="11" fill="#1f3550" stroke="#4a1e05" stroke-width="4"/>
  </g>
  <text x="856" y="618" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#4a1e05">full body, 2.5 heads</text>

  <!-- silhouette check -->
  <rect x="1012" y="140" width="168" height="200" fill="#ffffff" stroke="#d8cfc2"/>
  <g filter="url(#sil)"><use href="#bustA" transform="translate(1028,160) scale(0.2)"/></g>
  <text x="1016" y="356" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#4a1e05">bust silhouette</text>
  <rect x="1012" y="372" width="64" height="64" fill="#ffffff" stroke="#d8cfc2"/>
  <g filter="url(#sil)"><use href="#bustA" transform="translate(1022,380) scale(0.06)"/></g>
  <text x="1086" y="410" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#4a1e05">at 48 px</text>

  <!-- palette -->
  <g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#4a1e05">
    <rect x="812" y="630" width="52" height="52" fill="#ff8a2a" stroke="#4a1e05" stroke-width="2"/><text x="812" y="698">#ff8a2a</text><text x="812" y="712">ember</text>
    <rect x="874" y="630" width="52" height="52" fill="#e8642a" stroke="#4a1e05" stroke-width="2"/><text x="874" y="698">#e8642a</text><text x="874" y="712">copper</text>
    <rect x="936" y="630" width="52" height="52" fill="#4a1e05" stroke="#4a1e05" stroke-width="2"/><text x="936" y="698">#4a1e05</text><text x="936" y="712">line</text>
    <rect x="998" y="630" width="52" height="52" fill="#07111a" stroke="#4a1e05" stroke-width="2"/><text x="998" y="698">#07111a</text><text x="998" y="712">navy</text>
    <rect x="1060" y="630" width="52" height="52" fill="#ffd6a8" stroke="#4a1e05" stroke-width="2"/><text x="1060" y="698">#ffd6a8</text><text x="1060" y="712">skin</text>
    <rect x="1122" y="630" width="52" height="52" fill="#59b7ff" stroke="#4a1e05" stroke-width="2"/><text x="1122" y="698">#59b7ff</text><text x="1122" y="712">spark</text>
  </g>
  <text x="812" y="740" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#4a1e05">Shadows are darks of each base; wrench steel #cfd6dd is the one neutral.</text>
  <text x="812" y="758" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#4a1e05">Shape: a circle cut by one zigzag. Circle, bolt, bar.</text>
</svg>
