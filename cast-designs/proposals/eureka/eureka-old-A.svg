      <path d="M262 236 C290 198 340 178 380 176 L372 196 L356 192 L344 208 C320 210 290 222 262 236 Z" fill="#ff8a2a"/>
      <path d="M400 174 C420 172 440 174 456 180 L446 194 L432 188 L418 200 L404 190 Z" fill="#ff8a2a"/>
      <!-- near sideburn lock edge line -->
      <path d="M236 376 C230 410 230 440 226 470" fill="none" stroke="#4a1e05" stroke-width="3.5"/>
