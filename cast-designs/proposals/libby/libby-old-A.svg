      <path d="M170 18 L400 18 L445 30 L215 30 Z" fill="#7ddca5"/>
      <path d="M170 18 L215 30 L215 272 L170 260 Z" fill="#1f8f52"/>
      <path d="M215 90 L170 78 M215 150 L170 138 M215 210 L170 198" fill="none" stroke-width="2.5"/>
