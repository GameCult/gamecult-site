<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Bifrost patronage furnace</title>
  <desc id="desc">A loud diagram showing games, microtransactions, grants, and labor entering Bifrost, then log-power voting and project governance emerging.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070b"/>
      <stop offset="0.55" stop-color="#101018"/>
      <stop offset="1" stop-color="#221006"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a2a"/>
      <stop offset=".45" stop-color="#fff6cf"/>
      <stop offset="1" stop-color="#59b7ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:850;fill:#edf6ff}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:700;fill:#b7c7d9}
      .dark{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:850;fill:#07111c}
      .box{fill:#0b111a;stroke:#59b7ff;stroke-width:2.5}
      .arrow{fill:none;stroke:#ff8a2a;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;marker-end:url(#arrow)}
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ff8a2a"/>
    </marker>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <text x="800" y="58" text-anchor="middle" class="label" font-size="42">PATRONAGE FURNACE</text>
  <text x="800" y="92" text-anchor="middle" class="small" font-size="20">microtransactions, donations, grants, and labor become receipt-backed voting power</text>
  <g transform="translate(105 190)">
    <rect class="box" width="320" height="118" rx="20"/>
    <text x="160" y="48" text-anchor="middle" class="label" font-size="25">GAME SPEND</text>
    <text x="160" y="79" text-anchor="middle" class="small" font-size="18">skins, boosters, tips, passes</text>
  </g>
  <g transform="translate(105 392)">
    <rect class="box" width="320" height="118" rx="20"/>
    <text x="160" y="48" text-anchor="middle" class="label" font-size="25">PATRONAGE</text>
    <text x="160" y="79" text-anchor="middle" class="small" font-size="18">recurring support and bounties</text>
  </g>
  <g transform="translate(105 594)">
    <rect class="box" width="320" height="118" rx="20"/>
    <text x="160" y="48" text-anchor="middle" class="label" font-size="25">WORK RECEIPTS</text>
    <text x="160" y="79" text-anchor="middle" class="small" font-size="18">verified contribution value</text>
  </g>
  <path class="arrow" d="M425 250 C520 250 550 350 628 394"/>
  <path class="arrow" d="M425 451 C520 451 550 430 628 430"/>
  <path class="arrow" d="M425 653 C520 653 550 520 628 470"/>
  <g transform="translate(630 215)" filter="url(#glow)">
    <path d="M170 500 C70 430 46 350 72 258 C90 188 143 145 151 74 C220 128 222 206 205 261 C282 221 315 151 308 78 C438 186 476 324 417 441 C374 526 260 568 170 500 Z" fill="url(#fire)" opacity=".96"/>
    <rect x="43" y="345" width="400" height="190" rx="30" fill="#07111c" stroke="#ff8a2a" stroke-width="5"/>
    <text x="243" y="416" text-anchor="middle" class="label" font-size="39">BIFROST</text>
    <text x="243" y="454" text-anchor="middle" class="small" font-size="20">project-local ledger</text>
    <text x="243" y="487" text-anchor="middle" class="small" font-size="20">points, proofs, receipts</text>
  </g>
  <path class="arrow" d="M1080 450 C1172 430 1210 388 1266 330"/>
  <path class="arrow" d="M1080 475 C1178 500 1216 560 1266 630"/>
  <g transform="translate(1248 217)">
    <rect width="280" height="158" rx="24" fill="#8edfb0" stroke="#edf6ff" stroke-width="3"/>
    <text x="140" y="45" text-anchor="middle" class="dark" font-size="23">LOG-POWER VOTING</text>
    <text x="140" y="86" text-anchor="middle" class="dark" font-size="28">1 + log<tspan baseline-shift="sub" font-size="16">b</tspan>(points)</text>
    <text x="140" y="124" text-anchor="middle" class="dark" font-size="18">base 2 sharp, base 10 flat</text>
  </g>
  <g transform="translate(1248 574)">
    <rect width="280" height="158" rx="24" fill="#59b7ff" stroke="#edf6ff" stroke-width="3"/>
    <text x="140" y="45" text-anchor="middle" class="dark" font-size="23">PROJECT POWER</text>
    <text x="140" y="86" text-anchor="middle" class="dark" font-size="29">patrons vote</text>
    <text x="140" y="124" text-anchor="middle" class="dark" font-size="18">where consequence lives</text>
  </g>
  <g transform="translate(590 720)">
    <rect x="0" y="0" width="512" height="78" rx="18" fill="#0b111a" stroke="#ff8a2a" stroke-width="2"/>
    <text x="256" y="32" text-anchor="middle" class="label" font-size="21">EXAMPLE: 1,000,000 points vs 10,000 points</text>
    <text x="256" y="59" text-anchor="middle" class="small" font-size="18">base 10 yields 7 votes vs 5 votes: hierarchy flattened without pretending value is equal</text>
  </g>
</svg>
