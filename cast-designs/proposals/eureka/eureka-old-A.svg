    <!-- BUST torso -->
    <g id="torsoA">
      <!-- neck -->
      <path d="M362 556 L364 630 C390 646 420 646 446 630 L448 552 Z" fill="#ffd6a8" stroke="#4a1e05" stroke-width="6" stroke-linejoin="round"/>
      <path d="M364 572 C392 596 424 596 448 566 L448 600 C420 618 392 616 364 600 Z" fill="#f2b089"/>
      <!-- shoulders -->
