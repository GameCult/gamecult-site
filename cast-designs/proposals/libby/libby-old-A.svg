      <rect x="333" y="153" width="109" height="54" fill="#0f3d27"/>
      <path d="M333 153 L369 163 L369 223 L333 213 Z" fill="#1f8f52"/>
      <g fill="#f6e7c8" stroke-width="2.5">
        <path d="M352 168 L372 108 L420 120 L404 178 Z"/>
        <path d="M374 172 L388 112 L436 118 L428 176 Z"/>
        <path d="M398 174 L420 116 L466 128 L448 182 Z"/>
        <path d="M392 120 L430 125 M394 130 L426 134 M424 132 L456 141" stroke="#c8903a" stroke-width="2"/>
      </g>
      <path d="M333 153 L442 153 L478 163 L369 163 Z" fill="#7ddca5"/>
      <rect x="369" y="163" width="109" height="60" fill="#2fbf71"/>
      <rect x="376" y="170" width="95" height="46" rx="2" fill="#2fbf71" stroke-width="2"/>
      <path d="M378 212 L469 212" stroke="#1f8f52" stroke-width="5"/>
      <rect x="403" y="176" width="42" height="15" fill="#c8903a" stroke-width="2"/>
      <rect x="408" y="179" width="32" height="9" fill="#f6e7c8" stroke="none"/>
      <path d="M409 196 C409 210 439 210 439 196 Z" fill="#c8903a" stroke-width="2"/>
      <!-- brass base rail -->
      <path d="M170 254 L215 266 L445 266 L445 278 L215 278 L170 266 Z" fill="#c8903a"/>
      <path d="M445 36 L445 262" stroke="#2fbf71" stroke-width="0"/>
    </g>
  </g>

  <!-- ===== bust body: cardigan, square collar ===== -->
  <g id="bustbody" stroke="#0f3d27" stroke-width="3" stroke-linejoin="round">
    <path d="M298 580 L300 652 L378 652 L374 580 Z" fill="#f3c9a8"/>
    <path d="M298 584 C326 606 356 606 376 590 L377 628 L299 632 Z" fill="#e3a98a" stroke="none"/>
    <path d="M110 790 C112 712 150 670 232 652 L300 640 L380 640 L456 652 C528 666 566 710 576 790 Z" fill="#2fbf71"/>
    <path d="M440 660 C500 676 540 712 548 790 L576 790 C566 710 528 666 456 652 Z" fill="#1f8f52" stroke="none"/>
    <path d="M300 640 L338 790 L384 640 Z" fill="#f6e7c8"/>
    <path d="M300 640 L244 652 L258 712 L326 704 Z" fill="#f6e7c8"/>
    <path d="M384 640 L436 650 L424 708 L352 704 Z" fill="#f6e7c8"/>
    <path d="M330 704 L340 760 L350 704 Z" fill="#e0cba3" stroke="none"/>
    <path d="M272 664 L300 662 M402 662 L420 664" stroke="#c8903a" stroke-width="3"/>
    <path d="M326 704 L338 790 L352 704" fill="none"/>
    <circle cx="360" cy="730" r="7" fill="#c8903a"/>
    <circle cx="352" cy="770" r="7" fill="#c8903a"/>
    <path d="M560 720 C570 750 574 770 576 790" fill="none" stroke="#2fbf71" stroke-width="0"/>
  </g>

  <!-- ===== raised hand with the index card ===== -->
  <g id="cardhand" stroke="#0f3d27" stroke-width="3" stroke-linejoin="round" stroke-linecap="round">
    <path d="M492 790 C488 720 492 650 500 594 L560 590 C566 650 572 720 580 790 Z" fill="#2fbf71"/>
    <path d="M540 594 C548 660 556 720 562 790 L580 790 C572 720 566 650 560 590 Z" fill="#1f8f52" stroke="none"/>
    <path d="M496 594 L562 588 L564 610 L498 616 Z" fill="#f6e7c8"/>
    <g transform="rotate(-9 575 470)">
      <rect x="488" y="408" width="182" height="122" rx="4" fill="#f6e7c8" stroke-width="4"/>
      <path d="M488 436 L670 436" stroke="#d9483b" stroke-width="2.5"/>
      <path d="M500 452 L656 452 M500 470 L656 470 M500 488 L656 488 M500 506 L600 506" stroke="#e0cba3" stroke-width="1.5"/>
      <text x="499" y="430" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#0f3d27" stroke="none">LIBBY.cc</text>
      <text x="501" y="466" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#2a2340" stroke="none">id    u64</text>
      <text x="501" y="484" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#2a2340" stroke="none">name  str</text>
      <text x="501" y="502" font-family="Consolas, 'Courier New', monospace" font-size="13" fill="#2a2340" stroke="none">tags  [str]</text>
      <g transform="translate(14 -26) rotate(-14 622 492)">
        <rect x="586" y="476" width="74" height="30" rx="3" fill="none" stroke="#d9483b" stroke-width="3"/>
        <text x="594" y="497" font-family="Consolas, 'Courier New', monospace" font-size="15" font-weight="700" fill="#d9483b" stroke="none">TYPED</text>
      </g>
    </g>
    <!-- hand: fingers behind card edge, thumb in front -->
    <path d="M496 566 C494 540 506 528 530 528 C554 528 568 542 568 564 C568 584 556 598 532 598 C510 598 498 586 496 566 Z" fill="#f3c9a8"/>
    <path d="M552 532 C566 540 568 566 556 584 C548 592 540 594 530 596 C548 580 556 556 552 532 Z" fill="#e3a98a" stroke="none"/>
    <path d="M508 546 C510 528 524 514 540 512 C550 512 550 524 540 532 C530 540 522 544 520 552 Z" fill="#f3c9a8"/>
    <path d="M520 568 L548 566 M522 582 L546 580" fill="none" stroke-width="2"/>
  </g>

  <!-- whole bust, clipped at mid-chest -->
  <g id="bust" clip-path="url(#chest)">
    <use href="#backhair"/>
    <use href="#bustbody"/>
    <use href="#headfront"/>
    <use href="#cardhand"/>
  </g>

  <!-- chibi body (2.5 heads), drawn in chibi space, head scaled 0.36 -->
  <g id="chibibody" stroke="#0f3d27" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round">
    <path d="M90 382 L92 424 L104 424 L104 382 Z M128 382 L128 424 L140 424 L142 382 Z" fill="#f3c9a8"/>
