    </filter>
    <clipPath id="cardClip"><rect x="-200" y="-200" width="1200" height="980"/></clipPath>

    <!-- eye openings -->
    <clipPath id="eyeL"><path d="M268 440 C278 410 338 398 378 416 C384 448 378 480 362 496 C332 506 296 504 280 490 C270 474 266 456 268 440 Z"/></clipPath>
    <clipPath id="eyeR"><path d="M454 432 C472 410 514 404 534 420 C540 450 534 480 522 494 C500 504 472 502 460 490 C452 470 450 450 454 432 Z"/></clipPath>

    <!-- the wrench, local axis along +x, jaw at the far end -->
