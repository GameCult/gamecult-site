    <path d="M78 226 L154 226 C166 256 168 296 164 326 L70 326 C66 296 68 256 78 226 Z" fill="#2fbf71"/>
    <path d="M100 226 L116 262 L132 226 Z" fill="#f6e7c8"/>
    <path d="M116 262 L116 326" fill="none"/>
    <circle cx="122" cy="282" r="3.5" fill="#c8903a"/>
    <circle cx="122" cy="304" r="3.5" fill="#c8903a"/>
    <path d="M80 232 C64 256 58 282 62 302 L76 300 C76 282 80 262 90 246 Z" fill="#2fbf71"/>
    <circle cx="68" cy="308" r="10" fill="#f3c9a8"/>
    <path d="M150 234 C168 222 180 204 186 186 L172 178 C166 196 156 210 142 220 Z" fill="#2fbf71"/>
    <g transform="rotate(-10 196 150)">
      <rect x="160" y="124" width="72" height="50" rx="2" fill="#f6e7c8"/>
      <path d="M168 140 L224 140 M168 150 L224 150 M168 160 L206 160" stroke="#e0cba3" stroke-width="2"/>
      <rect x="204" y="152" width="22" height="12" fill="none" stroke="#d9483b" stroke-width="2"/>
    </g>
    <circle cx="180" cy="174" r="11" fill="#f3c9a8"/>
  </g>
</defs>

<!-- ===== sheet ===== -->
<rect width="1200" height="800" fill="#efeae0"/>

<!-- portrait card: GameCult ground, parallelogram, edge-lit in key green -->
<path d="M58 14 L792 14 L752 786 L18 786 Z" fill="url(#glow)"/>
<path d="M58 14 L792 14 L752 786 L18 786 Z" fill="none" stroke="#2fbf71" stroke-width="4"/>

<g transform="translate(70 4) scale(0.985)">
  <use href="#bust" filter="url(#outline)"/>
</g>
<text x="80" y="46" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#2fbf71" letter-spacing="4">BUST · SPECIMEN</text>

<!-- full-body chibi -->
<text x="820" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f3d27" letter-spacing="3">FULL BODY · 2.5 HEADS</text>
<g transform="translate(830 50)" filter="url(#outline)">
  <g transform="scale(0.36)"><use href="#backhair"/></g>
  <use href="#chibibody"/>
  <path d="M108 206 L108 232 L130 232 L130 206 Z" fill="#f3c9a8" stroke="#0f3d27" stroke-width="2.5"/>
  <g transform="scale(0.36)"><use href="#headfront"/></g>
</g>

<!-- silhouettes -->
<text x="1050" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="13" fill="#0f3d27" letter-spacing="3">SILHOUETTE</text>
<g transform="translate(1040 52) scale(0.19)"><use href="#bust" filter="url(#sil)"/></g>
<g transform="translate(1076 222) scale(0.06)"><use href="#bust" filter="url(#sil)"/></g>
<text x="1050" y="290" font-family="Segoe UI, Arial, sans-serif" font-size="11" fill="#555">48 px</text>

<!-- title, hook, palette -->
<text x="820" y="540" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#0f3d27">LIBBY · A</text>
<text x="820" y="570" font-family="Segoe UI, Arial, sans-serif" font-size="18" fill="#0f3d27" letter-spacing="2">THE CARD CATALOGUE</text>
<text x="820" y="606" font-family="Segoe UI, Arial, sans-serif" font-size="14.5" fill="#222">
  <tspan x="820">Hook: a hat of card-catalogue drawers as tall</tspan>
  <tspan x="820" dy="19">as her face, one drawer pulled open on index cards.</tspan>
</text>
<g font-family="Consolas, 'Courier New', monospace" font-size="11" fill="#333">
