<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">GameCult portfolio value orbit map</title>
  <desc id="desc">A radial orbit graphic placing Bifrost, Eve, CultMesh, and Sai at the center with portfolio projects orbiting by value layer.</desc>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0" stop-color="#10243a"/>
      <stop offset="0.55" stop-color="#080d16"/>
      <stop offset="1" stop-color="#05070b"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .label{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:850;fill:#edf6ff}
      .small{font-family:Inter,Segoe UI,Arial,sans-serif;font-weight:700;fill:#b7c7d9}
      .orbit{fill:none;stroke:#59b7ff;stroke-width:2;stroke-dasharray:10 14;opacity:.55}
      .line{stroke:#8edfb0;stroke-width:2;opacity:.55}
      .chip{fill:#0b111a;stroke:#59b7ff;stroke-width:2}
    </style>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="800" cy="450" r="115" fill="#0b111a" stroke="#ff8a2a" stroke-width="5" filter="url(#glow)"/>
  <circle cx="800" cy="450" r="60" fill="#07182a" stroke="#8edfb0" stroke-width="3"/>
  <text x="800" y="428" text-anchor="middle" class="label" font-size="35">CULTMESH</text>
  <text x="800" y="462" text-anchor="middle" class="small" font-size="20">state substrate</text>
  <text x="800" y="494" text-anchor="middle" class="small" font-size="18">authority made visible</text>
  <circle class="orbit" cx="800" cy="450" r="210"/>
  <circle class="orbit" cx="800" cy="450" r="315"/>
  <circle class="orbit" cx="800" cy="450" r="415"/>
  <line class="line" x1="800" y1="450" x2="800" y2="200"/>
  <line class="line" x1="800" y1="450" x2="1086" y2="310"/>
  <line class="line" x1="800" y1="450" x2="1080" y2="600"/>
  <line class="line" x1="800" y1="450" x2="522" y2="604"/>
  <line class="line" x1="800" y1="450" x2="510" y2="310"/>
  <g transform="translate(650 116)">
    <rect class="chip" width="300" height="95" rx="18"/>
    <text x="150" y="39" text-anchor="middle" class="label" font-size="25">EVE</text>
    <text x="150" y="67" text-anchor="middle" class="small" font-size="17">surface web renderer</text>
  </g>
  <g transform="translate(1035 270)">
    <rect class="chip" width="286" height="95" rx="18"/>
    <text x="143" y="39" text-anchor="middle" class="label" font-size="25">BIFROST</text>
    <text x="143" y="67" text-anchor="middle" class="small" font-size="17">patronage ledger</text>
  </g>
  <g transform="translate(988 594)">
    <rect class="chip" width="300" height="95" rx="18"/>
    <text x="150" y="39" text-anchor="middle" class="label" font-size="25">SAI</text>
    <text x="150" y="67" text-anchor="middle" class="small" font-size="17">VN public interface</text>
  </g>
  <g transform="translate(294 594)">
    <rect class="chip" width="318" height="95" rx="18"/>
    <text x="159" y="39" text-anchor="middle" class="label" font-size="25">EPIPHANY</text>
    <text x="159" y="67" text-anchor="middle" class="small" font-size="17">agent work memory</text>
  </g>
  <g transform="translate(260 270)">
    <rect class="chip" width="320" height="95" rx="18"/>
    <text x="160" y="39" text-anchor="middle" class="label" font-size="25">GAMES</text>
    <text x="160" y="67" text-anchor="middle" class="small" font-size="17">patrons become voters</text>
  </g>
  <g class="small" font-size="17">
    <text x="800" y="28" text-anchor="middle" class="label" font-size="36">VALUE ORBIT MAP</text>
    <text x="800" y="62" text-anchor="middle">Core substrate pulls project revenue, governance, creator tools, agents, and games into one accountable gravity well.</text>
    <text x="800" y="252" text-anchor="middle">SURFACE LAYER</text>
    <text x="1116" y="453" text-anchor="middle">GOVERNANCE LAYER</text>
    <text x="800" y="785" text-anchor="middle">PUBLIC STORY LAYER</text>
    <text x="484" y="453" text-anchor="middle">PRODUCT WEDGES</text>
  </g>
  <g filter="url(#glow)">
    <circle cx="972" cy="108" r="18" fill="#ff8a2a"/><text x="1000" y="114" class="small" font-size="17">Fensalir</text>
    <circle cx="1208" cy="168" r="18" fill="#8edfb0"/><text x="1236" y="174" class="small" font-size="17">Mimir</text>
    <circle cx="1364" cy="430" r="18" fill="#59b7ff"/><text x="1392" y="436" class="small" font-size="17">Norn</text>
    <circle cx="1220" cy="760" r="18" fill="#ff8a2a"/><text x="1248" y="766" class="small" font-size="17">Ghostlight</text>
    <circle cx="728" cy="840" r="18" fill="#8edfb0"/><text x="756" y="846" class="small" font-size="17">Weksa</text>
    <circle cx="285" cy="760" r="18" fill="#59b7ff"/><text x="313" y="766" class="small" font-size="17">AquaSynth</text>
    <circle cx="188" cy="430" r="18" fill="#ff8a2a"/><text x="216" y="436" class="small" font-size="17">StreamPixels</text>
    <circle cx="384" cy="168" r="18" fill="#8edfb0"/><text x="412" y="174" class="small" font-size="17">VoidBot</text>
  </g>
</svg>
