      <path d="M8 6 L380 8 L380 19 L4 15 Z" fill="#8f9aa5"/>
      <rect x="40" y="-8" width="230" height="16" rx="8" fill="#8f9aa5" stroke="#4a1e05" stroke-width="3"/>
      <path d="M372 -30 C394 -64 460 -72 492 -46 L478 -14 L440 -14 L440 14 L478 14 L492 46 C460 72 394 64 372 30 Z" fill="#cfd6dd" stroke="#4a1e05" stroke-width="6" stroke-linejoin="round"/>
