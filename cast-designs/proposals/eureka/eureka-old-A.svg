      <path d="M520 658 L562 668 C580 696 604 740 614 800 L548 800 C548 730 536 690 520 658 Z" fill="#e8642a"/>
      <path d="M300 690 C340 724 380 732 430 730" fill="none" stroke="#4a1e05" stroke-width="3"/>
