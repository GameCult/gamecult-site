    <g id="fistA">
      <path d="M196 800 C200 760 214 726 236 704 L282 716 C266 744 256 772 254 800 Z" fill="#ffd6a8" stroke="#4a1e05" stroke-width="7" stroke-linejoin="round"/>
      <path d="M262 716 L282 716 C266 744 256 772 254 800 L232 800 C238 770 248 740 262 716 Z" fill="#f2b089"/>
      <g transform="translate(261,680) rotate(-22)">
