      <path d="M282 384 C300 362 336 356 362 366" fill="none" stroke="#4a1e05" stroke-width="6" stroke-linecap="round"/>
      <path d="M466 380 C484 372 508 372 526 382" fill="none" stroke="#4a1e05" stroke-width="6" stroke-linecap="round"/>

