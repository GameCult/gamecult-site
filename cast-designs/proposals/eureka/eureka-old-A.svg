      <path d="M444 498 L438 510 L448 510" fill="none" stroke="#c4561f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M414 536 C432 544 452 542 472 526" fill="none" stroke="#4a1e05" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M468 520 L478 530" stroke="#4a1e05" stroke-width="4" stroke-linecap="round"/>

