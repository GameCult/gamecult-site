<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
<!-- Libby, take C: Quiet Please. Three takes on the canon design (cotsc-praxis character sheet). Hand-authored. -->
<defs>
