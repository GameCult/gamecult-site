  <rect x="880" y="660" width="52" height="52" fill="#0f3d27" stroke="#0f3d27" stroke-width="2"/><text x="880" y="728">#0f3d27</text>
  <rect x="940" y="660" width="52" height="52" fill="#f6e7c8" stroke="#0f3d27" stroke-width="2"/><text x="940" y="728">#f6e7c8</text>
  <rect x="1000" y="660" width="52" height="52" fill="#c8903a" stroke="#0f3d27" stroke-width="2"/><text x="1000" y="728">#c8903a</text>
  <rect x="1060" y="660" width="52" height="52" fill="#2a2340" stroke="#0f3d27" stroke-width="2"/><text x="1060" y="728">#2a2340</text>
  <rect x="1120" y="660" width="52" height="52" fill="#f3c9a8" stroke="#0f3d27" stroke-width="2"/><text x="1120" y="728">#f3c9a8</text>
</g>
<text x="820" y="760" font-family="Segoe UI, Arial, sans-serif" font-size="12" fill="#555">key · line · card stock · brass · hair · skin</text>
</svg>
